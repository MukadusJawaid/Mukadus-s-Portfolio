<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mukadus Jawaid, Software Engineer and frontend specialist">
  <title>Mukadus Jawaid · Software Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset=".55" stop-color="#151b36"/>
      <stop offset="1" stop-color="#0e3b45"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#13bfae"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#7a5cff" stop-opacity=".42"/><stop offset="1" stop-color="#7a5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#13bfae" stop-opacity=".34"/><stop offset="1" stop-color="#13bfae" stop-opacity="0"/></radialGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141c3a"/><stop offset="1" stop-color="#070a16"/></linearGradient>
    <linearGradient id="iconScr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5cff"/><stop offset="1" stop-color="#19c2b4"/></linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="26"/></clipPath>
  </defs>

  <style>
    .name  { font: 700 68px -apple-system, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -1px }
    .role  { font: 500 27px -apple-system, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; fill: #cfd6f7 }
    .stack { font: 600 22px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #7fe3d4; opacity: 0 }
    .tag   { font: 500 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #8a93b8; letter-spacing: 3px }
    @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(34px,-18px) } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-30px,16px) } }
    @keyframes show { 0% { opacity: 0 } 4% { opacity: 1 } 22% { opacity: 1 } 27% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes sweep { 0% { stroke-dashoffset: 540 } 100% { stroke-dashoffset: 0 } }
    .a { animation: drift 11s ease-in-out infinite }
    .b { animation: drift2 13s ease-in-out infinite }
    .s { animation: show 12s linear infinite }
    .s1 { animation-delay: 0s } .s2 { animation-delay: 3s } .s3 { animation-delay: 6s } .s4 { animation-delay: 9s }
    .rule { stroke-dasharray: 540; animation: sweep 2.4s ease-out both }
    @media (prefers-reduced-motion: reduce) { .a, .b, .s, .rule { animation: none } .s1 { opacity: 1 } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle class="a" cx="1010" cy="70" r="260" fill="url(#orbA)"/>
    <circle class="b" cx="200" cy="300" r="240" fill="url(#orbB)"/>

    <!-- a faint grid, like the desk's blotter -->
    <g stroke="#ffffff" stroke-opacity=".035">
      <path d="M0 80H1200M0 160H1200M0 240H1200"/>
      <path d="M300 0V320M600 0V320M900 0V320"/>
    </g>

    <!-- the favicon: a laptop with a folder on its screen -->
    <g transform="translate(70 70) scale(.36)">
      <rect width="512" height="512" rx="116" fill="url(#iconBg)"/>
      <rect x="92" y="112" width="328" height="214" rx="26" fill="#1b2340" stroke="#4a5cb0" stroke-width="8"/>
      <rect x="114" y="134" width="284" height="170" rx="12" fill="url(#iconScr)"/>
      <path d="M200 190V182Q200 173 209 173H236L252 190Z" fill="#fff" fill-opacity=".55"/>
      <rect x="200" y="186" width="112" height="78" rx="12" fill="#fff" fill-opacity=".94"/>
      <path d="M58 350H454L432 388Q428 398 416 398H96Q84 398 80 388Z" fill="#d3d9ea"/>
      <rect x="214" y="350" width="84" height="12" rx="6" fill="#98a2c0"/>
    </g>

    <text class="tag" x="292" y="86">PORTFOLIO · KARACHI</text>
    <text class="name" x="288" y="162">Mukadus Jawaid</text>
    <text class="role" x="292" y="208">Software Engineer · Frontend Specialist</text>
    <path class="rule" d="M292 228H832" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>

    <text class="stack s s1" x="292" y="270">React · Next.js · TypeScript</text>
    <text class="stack s s2" x="292" y="270">Three.js · Tailwind CSS · Framer Motion</text>
    <text class="stack s s3" x="292" y="270">Responsive · Animation · Design</text>
    <text class="stack s s4" x="292" y="270">Open to frontend and full-stack roles</text>
  </g>
</svg>
